root_dir: ..

phase2_init_translation:
  inputs:
    params_path: optimization_pipeline/data/params_init.pkl
    keypoints_path: optimization_pipeline/data/keypoints2d.pkl
    cameras_path: optimization_pipeline/data/cameras.pkl
  model:
    smpl_model_path: models/SMPL_NEUTRAL.pkl
    j_regressor_path: models/J_regressor_body25.npy
    device: auto
    num_keypoints: 15
  thresholds:
    min_conf_sum: 7.5
  output:
    params_path: optimization_pipeline/output/phase2_params.pkl

phase3_smooth_poses:
  inputs:
    params_path: optimization_pipeline/output/phase2_params.pkl
  smooth:
    window_size: 2
  output:
    params_path: optimization_pipeline/output/phase3_params.pkl

phase4_mean_shapes:
  inputs:
    params_path: optimization_pipeline/output/phase3_params.pkl
  mean_shape:
    axis: 0
    keepdims: true
  output:
    params_path: optimization_pipeline/output/phase4_params.pkl

phase5_init_rt:
  inputs:
    params_path: optimization_pipeline/output/phase4_params.pkl
    keypoints_path: optimization_pipeline/data/keypoints2d.pkl
    cameras_path: optimization_pipeline/data/cameras.pkl
  model:
    smpl_model_path: models/SMPL_NEUTRAL.pkl
    j_regressor_path: models/J_regressor_body25.npy
    device: auto
  optimizer:
    type: lbfgs
    lr: 1.0
    max_iter: 20
    max_outer_steps: 1000
    tolerance_grad: 1.0e-7
    tolerance_change: 1.0e-7
    relative_tolerance: 1.0e-7
  reprojection:
    weight: 100.0
    joint_indices: [2, 5, 9, 12]
  smooth:
    weight: 1.0
    window_weight: [0.5, 0.3, 0.1, 0.1]
    linear_weight: 100.0
    depth_weight: 1000.0
    order: 2
  output:
    params_path: optimization_pipeline/output/phase5_params.pkl
    summary_path: optimization_pipeline/output/phase5_summary.json

phase6_refine_poses:
  inputs:
    params_path: optimization_pipeline/output/phase5_params.pkl
    keypoints_path: optimization_pipeline/data/keypoints2d.pkl
    cameras_path: optimization_pipeline/data/cameras.pkl
  model:
    smpl_model_path: models/SMPL_NEUTRAL.pkl
    j_regressor_path: models/J_regressor_body25.npy
    device: auto
  optimizer:
    type: lbfgs
    lr: 1.0
    max_iter: 20
    max_outer_steps: 1000
    tolerance_grad: 1.0e-7
    tolerance_change: 1.0e-7
    relative_tolerance: 1.0e-7
  repeat: 2
  reprojection:
    weight: 100.0
    gm_rho: 0.02
  smooth:
    weight: 1.0
    window_weight: [0.5, 0.3, 0.1, 0.1]
    th_linear_weight: 100.0
    th_depth_weight: 1000.0
    pose_weight: 50.0
    keypoints_weight: 100.0
    order: 2
  init_anchor:
    weight: 1.0
  prior:
    weight: 0.1
    gmm_path: optimization_pipeline/multistage/gmm_08.pkl
    start: 0
    end: 69
  output:
    params_path: optimization_pipeline/output/phase6_params.pkl
    summary_path: optimization_pipeline/output/phase6_summary.json
