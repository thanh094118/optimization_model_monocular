runtime:
  stage: all
  clean_output: true
  verbose: true

paths:
  cam1_pkl: "input/wham_opencap_1.pkl"
  cam2_pkl: "input/wham_opencap_2.pkl"

  smpl_model: "models/SMPL_NEUTRAL.pkl"
  segmentation: "models/smpl_partSegmentation_mapping.pkl"
  j_regressor_body25: "models/J_regressor_body25.npy"

  pose_output_dir: "output/pose_results"
  fused_output_dir: "output/fused_results"
  learnable_output_dir: "output/learnable_results"
  visualization_output_dir: "output/visualize_results"
  evaluation_output_dir: "output/evaluation_results"
  refinement_output_dir: "output/refinement_results"

  debug1_dir: "output/debug1"
  debug2_dir: "output/debug2"

  camera1_video: "input/video_1.mp4"
  camera2_video: "input/video_2.mp4"

pose_export:
  enabled: true
  target_fps: 60
  max_sync_offset: 40
  min_overlap: 8
  min_improvement_ratio: 0.05

fusion:
  enabled: true

  occlusion:
    enabled: true
    tau: 0.01

  ransac:
    threshold: 0.05
    max_combos: 500

  optimization:
    regularization: true
    regularization_lambda: 1.0
    temporal_lambda: 2.0
    max_iter: 1000

  debug:
    save_debug1: true
    save_debug2: true

learnable:
  enabled: true
  # checkpoint: "models/real_best_ckpt.pth"
  checkpoint: "models/best_ckpt.pth.tar"
  lr: 0.03
  iterations: 80
  pose_prior_weight: 0.05
  trans_prior_weight: 0.05

visualization:
  enabled: true
  target_fps: 10
  dpi: 100
  max_frames: null
  video_search_dir: "."
  cameras:
    - camera1
    - camera2

refinement:
  enabled: false

  data_dir: "input"
  wham_file: "wham_opencap_1.pkl"
  video: "input/video_1.mp4"
  intrinsics: "input/cameraIntrinsics.pickle"
  subject_params: "input/subject_params.txt"
  parameters_yaml: "configs/parameters.yaml"

  activity: "sts"
  rotation: 0

  use_gpu: true
  static_cam: true
  n_iter_opt2: 75
  filter_freq: 6
  smoothness_diff_n: 1
  print_loss_terms: false
  plotting: true
  save_smpl_for_viz: true

evaluation:
  enabled: true
  ground_truth_dir: "input/gtruth_results"
  testcase_name: "testcase1"
