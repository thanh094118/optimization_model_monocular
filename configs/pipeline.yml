runtime:
  stage: visualization
  clean_output: true

preprocess:
  output_dir: "output/preprocess_results"
  offset_estimation:
    max_frames: null

inputs:
  cam1_pkl: "input/testcase1/wham_opencap_1.pkl"
  cam2_pkl: "input/testcase1/wham_opencap_2.pkl"
  camera1_video: "input/testcase1/video_1.mp4"
  camera2_video: "input/testcase1/video_2.mp4"
  ground_truth_dir: "input/testcase1/gtruth_results"

paths:
  smpl_model: "models/SMPL_NEUTRAL.pkl"
  segmentation: "models/smpl_partSegmentation_mapping.pkl"
  keypoints3d_map: "configs/keypoints3D_map.yml"
  keypoints2d_map: "configs/keypoints2D_map.yml"
  mapping_3dto2d: "configs/mapping_3dto2d.json"
  j_regressor_3d: "models/J_regressor_body25_plus_palm27.npy"

  pose_output_dir: "output/pose_results"
  fused_output_dir: "output/fused_results"
  learnable_output_dir: "output/learnable_results"
  visualization_output_dir: "output/visualize_results"
  evaluation_output_dir: "output/evaluation_results"

pose_export:
  enabled: true
  target_fps: 60
  max_sync_offset: 40
  min_overlap: 8
  min_improvement_ratio: 0.05

fusion:
  enabled: true

  occlusion:
    enabled: true
    tau: 0.01

  ransac:
    threshold: 0.05
    max_combos: 500

  optimization:
    regularization: true
    regularization_lambda: 1.0
    temporal_lambda: 2.0
    max_iter: 1000

learnable:
  enabled: true
  checkpoint: "models/best_ckpt.pth.tar"

visualization:
  enabled: true
  target_fps: 10
  dpi: 100
  max_frames: null
  video_search_dir: "."
  cameras:
    - camera1
    - camera2

evaluation:
  enabled: true
  testcase_name: null
  metrics:
    pa_mpjpe: true
    mpjpe: false
    pck: false
